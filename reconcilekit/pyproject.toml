[project]
name = "reconcilekit"
version = "0.1.0"
description = "A tiny stateless fetch-diff-apply reconciliation kernel for fleet-wide config tools"
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
