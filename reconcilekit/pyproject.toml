[project]
name = "reconcilekit"
version = "0.3.1"
description = "A tiny stateless fetch-diff-apply reconciliation kernel for fleet-wide config tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hugo Haas" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/hugoh/gh-workflows/tree/main/reconcilekit"
Issues = "https://github.com/hugoh/gh-workflows/issues"
Repository = "https://github.com/hugoh/gh-workflows"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcilekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
