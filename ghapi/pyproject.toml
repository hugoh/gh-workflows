[project]
name = "ghapi"
version = "0.1.0"
description = "Minimal async GitHub REST API transport for fleet-wide account tooling"
requires-python = ">=3.11"
dependencies = ["httpx2>=2.10", "pynacl>=1.5", "reconcilekit", "stamina>=25.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-httpx2>=0.1", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = ["-p", "pytest_httpx2"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
reconcilekit = { workspace = true }
