name: setup
description: Checkout the repo and set up mise
inputs:
  fetch-depth:
    description: Number of commits to fetch (0 = full history)
    required: false
    default: "1"
  extra-cache-key-cmd:
    description: >
      Shell command whose stdout determines an extra cache key for mise
      tools that are expensive to install (see mise-cache/action.yml).
      Leave empty to skip.
    required: false
    default: ""
  extra-cache-paths:
    description: Newline-separated paths to cache under that key.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.fetch-depth }}
    # Referenced by full path, not "./mise-cache": a relative local-action
    # path resolves against the calling workflow's checked-out workspace,
    # not this repo, so it breaks for every external caller of `setup`.
    # Pinned to a commit already containing mise-cache/action.yml unchanged.
    - uses: hugoh/gh-workflows/mise-cache@a191c18cc9ce938094c23cc77493a1b9b1c27573 # v1.33.0
      with:
        key-cmd: ${{ inputs.extra-cache-key-cmd }}
        paths: ${{ inputs.extra-cache-paths }}
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      env:
        # Widen mise's network timeouts so a slow mirror or cold cache
        # retries instead of aborting the job.
        MISE_HTTP_TIMEOUT: 120s
        MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 60s
