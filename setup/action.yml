name: setup
description: Checkout the repo and set up mise
inputs:
  fetch-depth:
    description: Number of commits to fetch (0 = full history)
    required: false
    default: "1"
  extra-cache-key-cmd:
    description: >-
      Shell command whose stdout determines an extra cache key. Leave
      empty to skip.
    required: false
    default: ""
  extra-cache-paths:
    description: Newline-separated paths to cache under that key.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.fetch-depth }}
    - name: Compute extra cache key
      if: inputs.extra-cache-key-cmd != ''
      id: extra-cache-key
      shell: bash
      env:
        EXTRA_CACHE_KEY_CMD: ${{ inputs.extra-cache-key-cmd }}
      run: |
        hash=$(bash -c "$EXTRA_CACHE_KEY_CMD" | sha256sum | cut -d' ' -f1)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.extra-cache-key-cmd != ''
      with:
        path: ${{ inputs.extra-cache-paths }}
        key: ${{ runner.os }}-extra-${{ steps.extra-cache-key.outputs.hash }}
        restore-keys: ${{ runner.os }}-extra-
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.9.2
      env:
        # Widen mise's network timeouts so a slow mirror or cold cache
        # retries instead of aborting the job.
        MISE_HTTP_TIMEOUT: 120s
        MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 60s
