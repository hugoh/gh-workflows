[project]
name = "repo-admin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "asyncgh",
  "httpx2>=2.10",
  "hugoh-repokit",
  "jinja2>=3.1",
  "pynacl>=1.5",
  "pyyaml>=6",
  "reconcilekit",
  "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-httpx2>=0.1", "respx>=0.21"]

[tool.pytest.ini_options]
addopts = ["-p", "pytest_httpx2"]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
asyncgh = { workspace = true }
hugoh-repokit = { workspace = true }
reconcilekit = { workspace = true }
