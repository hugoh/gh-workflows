# Secret name -> target repo list. Values live sops-encrypted in
# secrets.enc.yaml (see README.md). `repo_admin.py config bootstrap <repo>`
# adds a repo's workflow-referenced names here; hand-edits welcome.
TAP_GITHUB_TOKEN:
  repos: [hrd, jj-trim, netcheck, tmhi-cli]
PR_DIGEST_PAT:
  repos: [gh-digest]
SMTP_USERNAME:
  repos: [gh-digest]
SMTP_PASSWORD:
  repos: [gh-digest]
