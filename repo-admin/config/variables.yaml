# Variable name -> target repo list. Same shape as secrets.yaml; values live
# sops-encrypted in variables.enc.yaml. A repo's Actions variables aren't
# secret, but keeping the two configs identical means one `config bootstrap`
# and one `variables edit` cover both.
SMTP_HOST:
  repos: [gh-digest]
SMTP_PORT:
  repos: [gh-digest]
DIGEST_FROM_EMAIL:
  repos: [gh-digest]
DIGEST_TO_EMAIL:
  repos: [gh-digest]
