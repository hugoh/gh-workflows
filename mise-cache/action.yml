name: mise cache
description: >
  Cache a subset of mise's installed tools, keyed on caller-supplied content
  rather than the whole mise config. For tools that are expensive to install
  (built from source, heavy postinstall hooks), hashing the entire mise
  config busts the cache on every unrelated tool version bump; callers
  instead supply a command that extracts just the relevant bits.
inputs:
  key-cmd:
    description: >
      Shell command (run from the repo root, after checkout) whose stdout
      determines the cache key. Leave empty to skip caching entirely.
    required: false
    default: ""
  paths:
    description: >
      Newline-separated paths to cache (e.g. mise install dirs under
      ~/.local/share/mise/installs/<tool>). Required if key-cmd is set.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Compute mise cache key
      if: inputs.key-cmd != ''
      id: mise-cache-key
      shell: bash
      env:
        MISE_CACHE_KEY_CMD: ${{ inputs.key-cmd }}
      run: |
        hash=$(bash -c "$MISE_CACHE_KEY_CMD" | sha256sum | cut -d' ' -f1)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.key-cmd != ''
      with:
        path: ${{ inputs.paths }}
        key: ${{ runner.os }}-mise-${{ steps.mise-cache-key.outputs.hash }}
        restore-keys: ${{ runner.os }}-mise-
