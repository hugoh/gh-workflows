name: cog-bump
description: >-
  Bump the version with cocogitto (canonical fleet cog.toml) and, by default,
  push the new tag. Outputs the tag, or empty when there was nothing to
  release. Expects the repo already checked out with full history.
inputs:
  bump:
    description: "auto | patch | minor | major"
    required: false
    default: auto
  push:
    description: "Push the created tag to origin (needs contents: write)"
    required: false
    default: "true"
  token:
    description: Token used for the tag push
    required: false
    default: ${{ github.token }}
outputs:
  tag:
    description: The tag cocogitto created, or empty when nothing was releasable
    value: ${{ steps.bump.outputs.tag }}
runs:
  using: composite
  steps:
    - uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
      with:
        command: "--version"
    - id: bump
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BUMP: ${{ inputs.bump }}
        PUSH: ${{ inputs.push }}
      run: |
        set -euo pipefail
        arg="--auto"
        [ "$BUMP" != "auto" ] && arg="--$BUMP"

        cog --config "$GITHUB_ACTION_PATH/cog.toml" bump "$arg" || true

        TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1 || true)"
        if [ -z "$TAG" ]; then
          echo "cog-bump: nothing to release"
          exit 0
        fi
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

        if [ "$PUSH" = "true" ]; then
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "refs/tags/${TAG}"
        fi
