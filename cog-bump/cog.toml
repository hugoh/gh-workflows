# Canonical fleet cocogitto config, release-time only. `disable_bump_commit`
# means `cog bump` just creates the tag — no commit, no CHANGELOG.md — so no
# consumer repo needs its own cog.toml.
tag_prefix = "v"
disable_changelog = true
disable_bump_commit = true
ignore_merge_commits = true

[commit_types.perf]
bump_patch = true
