[project]
name = "asyncgh"
version = "0.1.0"
description = "Minimal async GitHub REST + GraphQL transport: auth, retry, pagination -- no generated models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hugo Haas" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = ["httpx2>=2.10", "pynacl>=1.5", "stamina>=25.2"]

[project.urls]
Homepage = "https://github.com/hugoh/gh-workflows/tree/main/asyncgh"
Issues = "https://github.com/hugoh/gh-workflows/issues"
Repository = "https://github.com/hugoh/gh-workflows"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-httpx2>=0.1", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asyncgh"]

[tool.pytest.ini_options]
addopts = ["-p", "pytest_httpx2"]
testpaths = ["tests"]
asyncio_mode = "auto"
