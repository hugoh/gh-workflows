[tools]
hk = "1.56.1"
uv = "0.12.7"
actionlint = "1.7.12"
pinact = "4.1.1"
zizmor = "1.29.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
typos = "1.50.0"
rumdl = "0.2.62"
shellcheck = "0.11.0"
"aqua:anordal/shellharden" = "4.3.2"
shfmt = "3.14.0"
tombi = "1.5.0"
"github:owenlamont/ryl" = "0.21.0"
biome = "2.5.10"
ruff = "0.16.5"
ty = "0.0.75"
sops = "3.13.3"

[tasks.test]
description = "Run every Python test suite"
depends = ["test:*"]

[tasks."test:repo-admin"]
description = "Run the repo-admin test suite"
dir = "repo-admin"
run = "uv run pytest"

[tasks."test:reconcilekit"]
description = "Run the reconcilekit test suite"
dir = "reconcilekit"
run = "uv run pytest"

[tasks."test:asyncgh"]
description = "Run the asyncgh test suite"
dir = "asyncgh"
run = "uv run pytest"

[tasks."test:repokit"]
description = "Run the repokit test suite"
dir = "repokit"
run = "uv run pytest"

[tasks.docs]
description = "Build API docs for every documented package into public/"
depends = ["docs:*"]

[tasks."docs:asyncgh"]
description = "Build asyncgh's API docs"
dir = "asyncgh"
run = "uv run --with pdoc pdoc asyncgh --output-directory ../public/asyncgh"

[tasks."docs:reconcilekit"]
description = "Build reconcilekit's API docs"
dir = "reconcilekit"
run = "uv run --with pdoc pdoc reconcilekit --output-directory ../public/reconcilekit"

[tasks."docs:repokit"]
description = "Build repokit's API docs"
dir = "repokit"
run = "uv run --with pdoc pdoc repokit --output-directory ../public/repokit"
