[tools]
hk = "1.58.1"
uv = "0.12.10"
actionlint = "1.7.12"
pinact = "4.1.1"
zizmor = "1.30.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
typos = "1.50.1"
rumdl = "0.2.65"
shellcheck = "0.11.0"
"aqua:anordal/shellharden" = "4.3.2"
shfmt = "3.14.0"
tombi = "1.5.1"
"github:owenlamont/ryl" = "0.21.0"
biome = "2.5.10"
ruff = "0.16.6"
ty = "0.0.78"
"github:tj-actions/auto-doc" = "3.6.0"

[tasks.gen]
description = "Regenerate the per-action / per-workflow Inputs/Outputs tables"
run = """
set -e
for d in setup hk-check tool-bumps mise-latest-versions trim-releases; do
  auto-doc --filename "$d/action.yml" --output "$d/README.md" \\
    --inputColumns Input --inputColumns Required --inputColumns Default --inputColumns Description \\
    --outputColumns Output --outputColumns Description --colMaxWords 100
done
for w in hk release secret-scan semantic-pr; do
  auto-doc --reusable --filename ".github/workflows/$w.yml" --output "docs/workflows/$w.md" \\
    --reusableInputColumns Input --reusableInputColumns Required --reusableInputColumns Default --reusableInputColumns Description \\
    --reusableOutputColumns Output --reusableOutputColumns Description \\
    --reusableSecretColumns Secret --reusableSecretColumns Required --reusableSecretColumns Description \\
    --colMaxWords 100
done
rumdl check --fix setup/README.md hk-check/README.md tool-bumps/README.md \\
  mise-latest-versions/README.md trim-releases/README.md docs/workflows/*.md
"""

[tasks.gen-check]
description = "Verify the generated action/workflow docs are in sync"
run = """
set -e
files="setup/README.md hk-check/README.md tool-bumps/README.md mise-latest-versions/README.md trim-releases/README.md docs/workflows/hk.md docs/workflows/release.md docs/workflows/secret-scan.md docs/workflows/semantic-pr.md"
before=$(shasum -a 256 $files | shasum -a 256)
mise run gen
after=$(shasum -a 256 $files | shasum -a 256)
[ "$before" = "$after" ] || { echo 'generated docs are out of date — run: mise run gen'; exit 1; }
"""

[tasks.test]
description = "Run the action helper test suites"
depends = ["test:*"]

[tasks."test:tool-bumps"]
description = "Run the tool-bumps test suite"
dir = "tool-bumps"
run = "uv run --no-project --python 3.12 python -m unittest discover -p 'test_*.py'"

[tasks."test:mise-latest-versions"]
description = "Run the mise-latest-versions test suite"
dir = "mise-latest-versions"
run = "uv run --no-project --python 3.12 --with pytest pytest -q"

[tasks."test:trim-releases"]
description = "Run the trim-releases test suite"
dir = "trim-releases"
run = "uv run --no-project --python 3.12 --with pytest pytest -q"
