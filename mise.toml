[tools]
hk = "1.57.0"
uv = "0.12.10"
actionlint = "1.7.12"
pinact = "4.1.1"
zizmor = "1.30.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
typos = "1.50.1"
rumdl = "0.2.65"
shellcheck = "0.11.0"
"aqua:anordal/shellharden" = "4.3.2"
shfmt = "3.14.0"
tombi = "1.5.1"
"github:owenlamont/ryl" = "0.21.0"
biome = "2.5.10"
ruff = "0.16.6"
ty = "0.0.78"

[tasks.test]
description = "Run the action helper test suites"
depends = ["test:*"]

[tasks."test:tool-bumps"]
description = "Run the tool-bumps test suite"
dir = "tool-bumps"
run = "uv run --no-project --python 3.12 python -m unittest discover -p 'test_*.py'"

[tasks."test:mise-latest-versions"]
description = "Run the mise-latest-versions test suite"
dir = "mise-latest-versions"
run = "uv run --no-project --python 3.12 --with pytest pytest -q"
