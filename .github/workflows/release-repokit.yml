name: release-repokit

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - repokit/**
      - .github/workflows/release-repokit.yml
      - .github/workflows/release-pypi.yml

jobs:
  publish:
    uses: ./.github/workflows/release-pypi.yml
    permissions:
      id-token: write
    with:
      environment: pypi-repokit
      uv-package: hugoh-repokit
