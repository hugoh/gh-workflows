name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_call:
    inputs:
      tag:
        description: Existing tag to create a GitHub Release for; skips the bump
        type: string
        required: false
      notes:
        description: "Release notes body (default: GitHub auto-generated notes)"
        type: string
        required: false
      major-tag:
        description: Also force-move the vN major tag to the new release (for Marketplace actions)
        type: boolean
        default: false
      package-command:
        description: >-
          Shell command that builds release artifacts, run after checkout with
          the repo's mise tools on PATH. Skipped when empty.
        type: string
        default: ""
      package-artifacts:
        description: >-
          Glob(s) of files produced by package-command to attach to the GitHub
          Release. Required when package-command is set.
        type: string
        default: ""
    outputs:
      tag:
        description: The tag that was released, or empty when there was nothing to release
        value: ${{ jobs.release.outputs.tag }}
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create a GitHub Release for; skips the bump
        required: false
        type: string
      notes:
        description: "Release notes body (default: GitHub auto-generated notes)"
        required: false
        type: string
      package-command:
        description: Shell command that builds release artifacts (mise tools on PATH). Skipped when empty.
        required: false
        type: string
      package-artifacts:
        description: Glob(s) of files to attach to the Release. Required when package-command is set.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: bump
        if: inputs.tag == ''
        uses: hugoh/cog-bump@0a5b6eb1c0c7eb8cf876a0ffaa06d27cb92f63db # v0.2.0

      - if: inputs.package-command != ''
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_HTTP_TIMEOUT: 120s
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 60s

      - name: Create a GitHub release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag != '' && inputs.tag || steps.bump.outputs.tag }}
          INPUT_NOTES: ${{ inputs.notes }}
          MAJOR_TAG: ${{ inputs.major-tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "nothing to release"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_NOTES" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$INPUT_NOTES"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

          if [ "$MAJOR_TAG" = "true" ]; then
            major="${TAG%%.*}"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" \
              -f "sha=${sha}" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${major}" -f "sha=${sha}"
          fi

      - name: Build and attach release artifacts
        if: inputs.package-command != '' && steps.release.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_COMMAND: ${{ inputs.package-command }}
          PACKAGE_ARTIFACTS: ${{ inputs.package-artifacts }}
        run: |
          set -euo pipefail
          bash -c "$PACKAGE_COMMAND"
          # shellcheck disable=SC2086  # deliberate glob/word-split for multiple artifact patterns
          gh release upload "$TAG" $PACKAGE_ARTIFACTS
