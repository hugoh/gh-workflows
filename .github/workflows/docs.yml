name: docs

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - asyncgh/**
      - reconcilekit/**
      - repokit/**
      - .github/workflows/docs.yml
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build asyncgh docs
        working-directory: asyncgh
        run: uv run --with pdoc pdoc asyncgh --output-directory ../public/asyncgh

      - name: Build reconcilekit docs
        working-directory: reconcilekit
        run: uv run --with pdoc pdoc reconcilekit --output-directory ../public/reconcilekit

      - name: Build repokit docs
        working-directory: repokit
        run: uv run --with pdoc pdoc repokit --output-directory ../public/repokit

      - name: Index page
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>gh-workflows docs</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                max-width: 40rem;
                margin: 3rem auto;
                padding: 0 1rem;
                color: #1a1a1a;
              }
              h1 {
                font-size: 1.5rem;
              }
              ul {
                padding-left: 1.25rem;
              }
              a {
                color: #0969da;
              }
            </style>
          </head>
          <body>
            <h1>gh-workflows docs</h1>
            <p>API reference for this repo's published Python packages.</p>
            <ul>
              <li><a href="asyncgh/">asyncgh</a></li>
              <li><a href="reconcilekit/">reconcilekit</a></li>
              <li><a href="repokit/">repokit</a></li>
            </ul>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
