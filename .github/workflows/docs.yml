name: docs

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - asyncgh/**
      - reconcilekit/**
      - .github/workflows/docs.yml
  workflow_dispatch: {}

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build asyncgh docs
        working-directory: asyncgh
        run: uv run --with pdoc pdoc asyncgh --output-directory ../public/asyncgh

      - name: Build reconcilekit docs
        working-directory: reconcilekit
        run: uv run --with pdoc pdoc reconcilekit --output-directory ../public/reconcilekit

      - name: Index page
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>gh-workflows docs</title>
          <ul>
            <li><a href="asyncgh/">asyncgh</a></li>
            <li><a href="reconcilekit/">reconcilekit</a></li>
          </ul>
          EOF

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
