name: ci

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create a GitHub Release for; skips the bump
        required: false
        type: string
      bump:
        description: Force the bump level (auto = derive from commits). Ignored when tag is set.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      notes:
        description: "Release notes body (default: cog changelog notes, falling back to GitHub auto-generated notes)"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: ./.github/workflows/hk.yml
    permissions:
      contents: read
      packages: read
      statuses: write

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  ci-gate:
    if: always()
    needs: [hk, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  release:
    needs: ci-gate
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || '' }}
      bump: ${{ inputs.bump || 'auto' }}
      notes: ${{ inputs.notes || '' }}
