name: digest

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 10 * * 6" # 5am Central (fixed UTC-5 offset; drifts to 4am during CST)
  workflow_dispatch: {}

jobs:
  digest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Send PR digest
        working-directory: repo-admin
        env:
          GH_TOKEN: ${{ secrets.PR_DIGEST_PAT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
        run: uv run digest.py
