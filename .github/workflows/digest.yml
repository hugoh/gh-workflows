name: digest

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 10 * * 6" # ~5am Central (fixed UTC-5 offset; drifts to 4am during CST); :17 avoids top-of-hour scheduling congestion on GitHub Actions
  workflow_dispatch: {}

jobs:
  digest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: hugoh/digest-action@9733f3511f947a5b7383335a45ef18e2003e1cee # v0.4.0
        with:
          owner: hugoh
          github-token: ${{ secrets.PR_DIGEST_PAT }}
          smtp-host: ${{ secrets.SMTP_HOST }}
          smtp-port: ${{ secrets.SMTP_PORT }}
          smtp-username: ${{ secrets.SMTP_USERNAME }}
          smtp-password: ${{ secrets.SMTP_PASSWORD }}
          digest-from-email: ${{ secrets.DIGEST_FROM_EMAIL }}
          digest-to-email: ${{ secrets.DIGEST_TO_EMAIL }}
