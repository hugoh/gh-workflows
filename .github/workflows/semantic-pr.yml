---
name: semantic-pr

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

permissions: {}

jobs:
  semantic-pr:
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-semantic-pr-${{ github.event.pull_request.number ||
        github.ref }}
      cancel-in-progress: true
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          subjectPattern: ^(?![A-Z][a-z]).+$
          subjectPatternError: >-
            "{subject}" must not start with a capitalized word (acronyms like
            TUI are fine) — the PR title becomes the squash-merge commit
            subject.
