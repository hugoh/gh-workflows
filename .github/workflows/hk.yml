name: hk

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      fetch-depth:
        description: Commits to fetch (0 = full history, for cog/conventional-commit checks)
        type: string
        default: "1"
      pre-hk:
        description: Shell command to run after mise setup, before `hk check` (e.g. a build)
        type: string
        default: ""
      apt-packages:
        description: Space-separated apt packages the lint job needs (cached)
        type: string
        default: ""
      extra-cache-key-cmd:
        description: >-
          Shell command whose stdout determines an extra cache key. Leave
          empty to skip.
        type: string
        default: ""
      extra-cache-paths:
        description: Newline-separated paths to cache under that key.
        type: string
        default: ""

permissions: {}

jobs:
  lint:
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
        github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: $/setup
        with:
          fetch-depth: ${{ inputs.fetch-depth || '1' }}
          apt-packages: ${{ inputs.apt-packages }}
          extra-cache-key-cmd: ${{ inputs.extra-cache-key-cmd }}
          extra-cache-paths: ${{ inputs.extra-cache-paths }}
      - name: Pre-check
        if: inputs.pre-hk != ''
        env:
          PRE_HK: ${{ inputs.pre-hk }}
        run: bash -c "$PRE_HK"
      - uses: $/hk-check
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
