name: Keep auto-merge PRs fresh

on: # yamllint disable-line rule:truthy
  workflow_call: {}

permissions: {}

jobs:
  update-behind-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update branch for stale auto-merge PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state open --json number,autoMergeRequest,mergeStateStatus \
            --jq '.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND") | .number' |
          while read -r pr; do
            echo "Updating PR #$pr (behind main, auto-merge enabled)"
            gh api "repos/$GH_REPO/pulls/$pr/update-branch" -X PUT
          done
