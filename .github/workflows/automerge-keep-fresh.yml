name: Keep auto-merge PRs fresh

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      pull-request-number:
        description: PR number to inspect instead of reconciling all open PRs
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  update-behind-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update stale auto-merge PRs
        uses: hugoh/gh-workflows/automerge-keep-fresh@98cb4d63a508c975a9766fb83426a5d87d6c5e95 # v1.40.0
        with:
          pull-request-number: ${{ inputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
